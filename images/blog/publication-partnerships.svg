<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">Publication output and partnerships</title><desc id="desc">Among the same 73 recurring conference last authors, papers increased from 142 in 2025 to 184 in 2026, while distinct first-last author pairs increased from 134 to 164.</desc><rect width="760" height="340" fill="#f6f8fb"/><g font-family="Arial, Helvetica, sans-serif" fill="#292e34"><text x="28" y="30" font-size="21" >The same 73 recurring last authors</text><text x="28" y="55" font-size="16" fill="#626a74">DAC · DATE · ASP-DAC</text><text x="65" y="92" font-size="20" >Papers</text><path d="M65,277 h235" stroke="#c6cedb"/><rect x="93" y="166.24" width="64" height="110.76" fill="#a7bad5"/><text x="125" y="158.24" font-size="21" text-anchor="middle">142</text><text x="125" y="307" font-size="18" text-anchor="middle" fill="#626a74">2025</text><rect x="207" y="133.48" width="64" height="143.52" fill="#305da4"/><text x="239" y="125.47999999999999" font-size="21" text-anchor="middle">184</text><text x="239" y="307" font-size="18" text-anchor="middle" fill="#626a74">2026</text><text x="435" y="92" font-size="20" >First–last author pairs</text><path d="M435,277 h235" stroke="#c6cedb"/><rect x="463" y="172.48" width="64" height="104.52000000000001" fill="#a7bad5"/><text x="495" y="164.48" font-size="21" text-anchor="middle">134</text><text x="495" y="307" font-size="18" text-anchor="middle" fill="#626a74">2025</text><rect x="577" y="149.07999999999998" width="64" height="127.92" fill="#305da4"/><text x="609" y="141.07999999999998" font-size="21" text-anchor="middle">164</text><text x="609" y="307" font-size="18" text-anchor="middle" fill="#626a74">2026</text></g></svg>
