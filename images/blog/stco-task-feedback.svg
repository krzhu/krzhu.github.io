<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" aria-labelledby="title desc"><title id="title">Connecting computing tasks to technology choices</title><desc id="desc">Workload and dataflow, physical implementation, and devices and manufacturing constrain one another. Compare the same computing task through cycles and achievable frequency, energy, area, and cost.</desc><rect width="900" height="410" fill="#f6f8fb"/><g font-family="Arial, Helvetica, sans-serif" fill="#292e34"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7" fill="#4973af"/></marker></defs><text x="450" y="37" font-size="24" text-anchor="middle">Compare the same computing task</text><rect x="30" y="93" width="250" height="120" fill="white" stroke="#b4c3d7"/><text x="155" y="137" font-size="20" text-anchor="middle">Workload &amp; dataflow</text><text x="155" y="176" font-size="15" text-anchor="middle" fill="#626a74">Operations · data movement</text><rect x="325" y="93" width="250" height="120" fill="white" stroke="#b4c3d7"/><text x="450" y="137" font-size="20" text-anchor="middle">Physical implementation</text><text x="450" y="176" font-size="15" text-anchor="middle" fill="#626a74">Layout · interconnect · power</text><rect x="620" y="93" width="250" height="120" fill="white" stroke="#b4c3d7"/><text x="745" y="137" font-size="20" text-anchor="middle">Technology choices</text><text x="745" y="176" font-size="15" text-anchor="middle" fill="#626a74">Devices · memory · integration</text><path d="M288,153 H317 M583,153 H612" stroke="#4973af" stroke-width="1.7" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M745,221 V257 H155 V221" stroke="#4973af" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/><text x="450" y="286" font-size="18" text-anchor="middle" fill="#4973af">Timing, power-delivery, and thermal feedback</text><path d="M80,313 H820" stroke="#dce3ec"/><text x="260" y="352" font-size="19" text-anchor="middle">Task time = cycles / runnable frequency</text><text x="680" y="352" font-size="19" text-anchor="middle">Energy · area · cost</text></g></svg>
