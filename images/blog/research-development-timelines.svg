<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title desc"><title id="title">Development continued after an early milestone</title><desc id="desc">Rewriting selected its direction on day 3 of a 23-day window. Contraction completed a netlist study on day 5 of 32. LUT optimization entered its C++ campaign on day 7 of 54. These are calendar days.</desc><rect width="760" height="330" fill="#f6f8fb"/><g font-family="Arial, Helvetica, sans-serif" fill="#292e34"><text x="28" y="32" font-size="18" fill="#626a74">Calendar days from project start</text><path d="M210,50 V275" stroke="#e1e6ef"/><text x="210" y="306" text-anchor="middle" font-size="15" fill="#626a74">0</text><path d="M295,50 V275" stroke="#e1e6ef"/><text x="295" y="306" text-anchor="middle" font-size="15" fill="#626a74">10</text><path d="M380,50 V275" stroke="#e1e6ef"/><text x="380" y="306" text-anchor="middle" font-size="15" fill="#626a74">20</text><path d="M465,50 V275" stroke="#e1e6ef"/><text x="465" y="306" text-anchor="middle" font-size="15" fill="#626a74">30</text><path d="M550,50 V275" stroke="#e1e6ef"/><text x="550" y="306" text-anchor="middle" font-size="15" fill="#626a74">40</text><path d="M635,50 V275" stroke="#e1e6ef"/><text x="635" y="306" text-anchor="middle" font-size="15" fill="#626a74">50</text><text x="28" y="90" font-size="20" >Rewriting</text><text x="415.5" y="91" font-size="18" >23</text><rect x="210" y="74" width="195.5" height="23" fill="#c6d3e6"/><rect x="210" y="74" width="25.5" height="23" fill="#305da4"/><path d="M235.5,70 v31" stroke="#305da4" stroke-width="2"/><text x="235.5" y="122" font-size="16" fill="#305da4" text-anchor="middle">Day 3</text><text x="28" y="171" font-size="20" >Contraction</text><text x="492" y="172" font-size="18" >32</text><rect x="210" y="155" width="272" height="23" fill="#c6d3e6"/><rect x="210" y="155" width="42.5" height="23" fill="#305da4"/><path d="M252.5,151 v31" stroke="#305da4" stroke-width="2"/><text x="252.5" y="203" font-size="16" fill="#305da4" text-anchor="middle">Day 5</text><text x="28" y="252" font-size="20" >LUT optimization</text><text x="679" y="253" font-size="18" >54</text><rect x="210" y="236" width="459" height="23" fill="#c6d3e6"/><rect x="210" y="236" width="59.5" height="23" fill="#305da4"/><path d="M269.5,232 v31" stroke="#305da4" stroke-width="2"/><text x="269.5" y="284" font-size="16" fill="#305da4" text-anchor="middle">Day 7</text></g></svg>
