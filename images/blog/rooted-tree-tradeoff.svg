<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="title desc"><title id="title">Two objectives in a rooted tree</title><desc id="desc">Schematic trees on the same terminals. Sharing edges can reduce total length; direct root connections can shorten root-to-terminal paths.</desc><rect width="760" height="320" fill="#f6f8fb"/><g font-family="Arial, Helvetica, sans-serif" fill="#292e34"><g transform="translate(92 72)"><path d="M0,150 L0,45" stroke="#3564a6" stroke-width="3" fill="none"/><path d="M0,45 L100,0" stroke="#3564a6" stroke-width="3" fill="none"/><path d="M100,0 L200,45" stroke="#3564a6" stroke-width="3" fill="none"/><path d="M200,45 L200,150" stroke="#3564a6" stroke-width="3" fill="none"/><circle cx="0" cy="150" r="8" fill="#ae6e48" stroke="#ae6e48" stroke-width="2"/><circle cx="0" cy="45" r="6" fill="white" stroke="#3564a6" stroke-width="2"/><circle cx="100" cy="0" r="6" fill="white" stroke="#3564a6" stroke-width="2"/><circle cx="200" cy="45" r="6" fill="white" stroke="#3564a6" stroke-width="2"/><circle cx="200" cy="150" r="6" fill="white" stroke="#3564a6" stroke-width="2"/><text x="-16" y="183" font-size="17" fill="#8e5738">root</text></g><g transform="translate(466 72)"><path d="M0,150 L0,45" stroke="#3564a6" stroke-width="3" fill="none"/><path d="M0,150 L100,0" stroke="#3564a6" stroke-width="3" fill="none"/><path d="M0,150 L200,45" stroke="#3564a6" stroke-width="3" fill="none"/><path d="M0,150 L200,150" stroke="#3564a6" stroke-width="3" fill="none"/><circle cx="0" cy="150" r="8" fill="#ae6e48" stroke="#ae6e48" stroke-width="2"/><circle cx="0" cy="45" r="6" fill="white" stroke="#3564a6" stroke-width="2"/><circle cx="100" cy="0" r="6" fill="white" stroke="#3564a6" stroke-width="2"/><circle cx="200" cy="45" r="6" fill="white" stroke="#3564a6" stroke-width="2"/><circle cx="200" cy="150" r="6" fill="white" stroke="#3564a6" stroke-width="2"/><text x="-16" y="183" font-size="17" fill="#8e5738">root</text></g><text x="190" y="30" font-size="22" text-anchor="middle">Share edges</text><text x="566" y="30" font-size="22" text-anchor="middle">Shorten root paths</text><text x="190" y="289" font-size="18" text-anchor="middle" fill="#626a74">Total length</text><text x="566" y="289" font-size="18" text-anchor="middle" fill="#626a74">Root-to-terminal distance</text></g></svg>
